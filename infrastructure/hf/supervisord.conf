; Runs every droplet service (minus Caddy and Postgres, see infrastructure/hf/README.md) in one
; HF Space container. All logs go to stdout/stderr -> the Space's own log viewer.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:clamav]
command=/bin/sh -c "freshclam --config-file=/etc/clamav/freshclam.conf || true; exec clamd --config-file=/etc/clamav/clamd.conf --foreground"
priority=1
autostart=true
autorestart=true
startretries=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; DB_HOST/DB_PORT point at AI-Postgre directly (see README.md) -- no tunnel: that server already
; accepts direct authenticated connections the same way the project's other databases do.
; %(ENV_X)s is supervisord's own substitution syntax (command= is not run through a shell, so
; $DB_HOST / ${DB_HOST} would not expand here).
[program:api]
command=/usr/local/bin/wait-for.sh %(ENV_DB_HOST)s %(ENV_DB_PORT)s -- /usr/local/bin/wait-for.sh 127.0.0.1 3310 -- /bin/sh -c "cd /app/backend && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
directory=/app/backend
priority=2
autostart=true
autorestart=true
startretries=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/wait-for.sh %(ENV_DB_HOST)s %(ENV_DB_PORT)s -- /usr/local/bin/wait-for.sh 127.0.0.1 3310 -- python -m app.workers.main
directory=/app/backend
priority=3
autostart=true
autorestart=true
startretries=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/wait-for.sh 127.0.0.1 8000 -- npx next start --port 7860 --hostname 0.0.0.0
directory=/app/frontend
priority=4
autostart=true
autorestart=true
startretries=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
