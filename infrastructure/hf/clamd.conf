# clamd config for the combined HF Space container. Mirrors the CLAMD_CONF_* overrides the
# droplet's clamav/clamav image sets in infrastructure/deployment/compose.yaml. Run in the
# foreground (supervisord passes --foreground) so output goes to stdout/stderr for its logs.
LocalSocket /run/clamav/clamd.ctl
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
ConcurrentDatabaseReload no
LogTime yes
